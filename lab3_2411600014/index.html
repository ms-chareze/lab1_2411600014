<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Grade Portal</title>
    <!-- Bootstrap 5 CSS CDN-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS-->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <!-- Login content goes here-->
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card login-card" style="max-width: 400px; width: 100%;">
            
            <!-- Card Header with Custom Branding -->
            <div class="card-header bg-primary text-white text-center py-4">
                <h2 class="mb-0">Student Grade Portal</h2>
                <p class="mb-0 small">Login to your dashboard</p>
            </div>

            <!-- Login Form inside Card Body -->
            <div class="card-body p-4">
                <!-- Alert feedback container for JS error/success messages -->
                <div id="loginFeedback"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                    </div>
                    <button type="button" class="btn btn-primary w-100" id="loginBtn">Login</button>
                </form>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JavaScript CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="js/login.js"></script>
</body>
</html>
