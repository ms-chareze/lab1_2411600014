<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory Management Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100" style="background-color: #fff0f5;">

    <div class="card shadow-lg p-4 border-0" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold" style="color: #641246;">Inventory Portal</h3>
            <p class="text-muted small">Please log in to access the dashboard</p>
        </div>

        <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold small" style="color: #641246;">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter username" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-bold small" style="color: #641246;">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn text-white fw-bold w-100 py-2" style="background-color: #9d80e4;">Sign In</button>
        </form>
    </div>

    
    <!-- Application JavaScript -->
    <script src="js/login.js"></script>
</body>
</html>
