<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Student Portal - Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS (Added for Lab 4 Screenshot 5 requirement) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Academic Student Portal</a>
            <div class="d-flex align-items-center text-white">
                <span id="welcomeUser" class="me-3 fw-semibold">Welcome, Admin</span>
                <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid my-4">
        <div class="row">
            
            <!-- Sidebar Controls -->
            <div class="col-lg-3 mb-4">
                <div class="card shadow-sm border-0 mb-3">
                    <div class="card-body">
                        <h5 class="card-title fw-bold mb-3">Simulation & Tools</h5>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="liveSimulationToggle">
                            <label class="form-check-label fw-semibold" for="liveSimulationToggle">Live Simulation Data</label>
                        </div>
                        <button class="btn btn-success w-100 fw-bold" id="exportBtn">Export to CSV</button>
                    </div>
                </div>
            </div>

            <!-- Main Dashboard Area -->
            <div class="col-lg-9">
                
                <!-- Filter & Search Controls Card -->
                <div class="card shadow-sm p-3 mb-4 border-0">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="searchInput" class="form-label small">Search Student</label>
                            <input type="text" id="searchInput" class="form-control" placeholder="Search by name or ID...">
                        </div>
                        <div class="col-md-3">
                            <label for="courseFilter" class="form-label small">Filter Course</label>
                            <select id="courseFilter" class="form-select">
                                <option value="All">All Courses</option>
                                <option value="BS Information Technology">BS Information Technology</option>
                                <option value="BS Computer Science">BS Computer Science</option>
                                <option value="BS Business Administration">BS Business Administration</option>
                                <option value="BS Office Administration">BS Office Administration</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="statusFilter" class="form-label small">Filter Status</label>
                            <select id="statusFilter" class="form-select">
                                <option value="All">All Statuses</option>
                                <option value="Regular">Regular</option>
                                <option value="Warning">Warning</option>
                                <option value="Probation">Probation</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button class="btn btn-outline-secondary w-100" id="resetFilters">Reset</button>
                        </div>
                    </div>
                </div>

                <!-- Metrics Display Cards -->
                <div class="row text-center mb-4 g-3">
                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 bg-white p-3">
                            <div class="text-muted small">Total Students</div>
                            <div class="fs-3 fw-bold text-primary" id="totalStudents">0</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 bg-white p-3">
                            <div class="text-muted small">Average GPA</div>
                            <div class="fs-3 fw-bold text-success" id="averageGPA">0.00</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 bg-white p-3">
                            <div class="text-muted small">Academic Warnings</div>
                            <div class="fs-3 fw-bold text-danger" id="academicWarnings">0</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 bg-white p-3">
                            <div class="text-muted small">Total Units</div>
                            <div class="fs-3 fw-bold text-dark" id="totalUnits">0</div>
                        </div>
                    </div>
                </div>

                <!-- Academic Alert Box -->
                <div id="academicWarningAlert" class="alert alert-danger d-none shadow-sm mb-4" role="alert">
                    <h6 class="alert-heading fw-bold">Academic Warning Alert (<span id="warningCountText">0</span> Students Needing Review)</h6>
                    <ul id="warningList" class="mb-0 small"></ul>
                </div>

                <!-- Visual Charts Section -->
                <div class="row mb-4 g-3">
                    <div class="col-md-4">
                        <div class="card shadow-sm border-0 p-3 h-100">
                            <h6 class="fw-bold mb-3">Course Distribution</h6>
                            <div class="chart-container" style="height: 200px;">
                                <canvas id="courseChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card shadow-sm border-0 p-3 h-100">
                            <h6 class="fw-bold mb-3">Academic Status</h6>
                            <div class="chart-container" style="height: 200px;">
                                <canvas id="statusChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card shadow-sm border-0 p-3 h-100">
                            <h6 class="fw-bold mb-3">Top Performing GPA</h6>
                            <div class="chart-container" style="height: 200px;">
                                <canvas id="topStudentsChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Student Records Data Table -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Student ID</th>
                                        <th>Name</th>
                                        <th>Course</th>
                                        <th>GPA</th>
                                        <th>Units</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="studentTableBody">
                                    <!-- Dynamic Rows Rendered by JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Project JavaScript Source Files -->
    <script src="js/dataManager.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
